services:
  db:
    build:
      context: .
      target: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kegtrack_owner
      POSTGRES_DB: kegtrack
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kegtrack_owner", "-d", "kegtrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://kegtrack_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}@db:5432/kegtrack?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administración}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kegtrack_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@db:5432/kegtrack?schema=public
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    profiles: ["lan"]
    build:
      context: .
      target: caddy
    restart: unless-stopped
    environment:
      LAN_HOST: ${LAN_HOST:-127.0.0.1}
    ports:
      - "8443:8443"
    volumes:
      - caddydata:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null --header \"Host: $$LAN_HOST:8443\" https://127.0.0.1:8443/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  caddydata:
